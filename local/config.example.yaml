###############################################################################
# Local (single-machine) configuration
#
# From the repository root:
#   cp local/config.example.yaml local/config.yaml
#   python pipeline/run_pipeline.py --config local/config.yaml --list   # see what will run
#   python pipeline/run_pipeline.py --config local/config.yaml          # run it
#
# Relative paths below are resolved against the folder this file lives in,
# so with the defaults your media goes in local/media/ and results land in
# local/output/.
#
# Out of the box this runs the steps that need no API key:
#   transcribe -> keyframes -> preview -> iiif
# The AI steps (describe_frames, summarize, tags, accessibility,
# collection_report, clustering) are switched off until you either
#   * export OPENAI_API_KEY=sk-...                         (OpenAI), or
#   * set `base_url` on those sections to a local server   (Ollama, LM Studio)
# and flip their `enabled:` to true.
###############################################################################

# Where to find media and which files to include
input:
  media_root: "media"                      # local/media (or an absolute path to your collection)
  include_extensions: [".mp4", ".mov", ".mkv", ".avi", ".webm", ".mpg", ".mpeg", ".mp3", ".wav", ".m4a", ".flac"]
  recurse: true                            # also scan subfolders

# Optional audio normalization with ffmpeg (Whisper can read most formats directly)
preprocessing:
  extract_audio: false                     # true = write 16 kHz mono WAVs first (useful for odd legacy codecs)
  audio_dir: "output/preprocessed_audio"
  overwrite_audio: false
  sample_rate: 16000
  audio_codec: "pcm_s16le"
  channels: 1

# Whisper model and decoding options
transcription:
  # Speed vs accuracy on a laptop CPU: tiny < base < small < medium < large-v3.
  # "base" is a good first run; use "small"/"medium" for better accuracy,
  # "large-v3" if you have an NVIDIA GPU (set device: "cuda").
  model: "base"
  device: "auto"                           # "auto", "cpu", or "cuda"
  language: null                           # e.g. "en" to skip language detection
  temperature: 0.0
  condition_on_previous_text: true
  initial_prompt: null
  suppress_tokens: "-1"

# Transcript outputs
outputs:
  base_dir: "output/transcripts"           # one subfolder per format: txt/, srt/, json/, tsv/
  formats: ["txt", "srt", "json", "tsv"]   # keep "tsv" or "json" if you want speech-segment keyframes
  overwrite: false                         # re-running skips files that already have transcripts
  writer_options:
    max_line_width: null
    max_line_count: null
    highlight_words: false

# Still frames from each video (audio-only files are skipped automatically)
keyframes:
  enabled: true
  modes: ["speech_segments", "interval"]   # speech_segments uses the transcripts made above
  output_dir: "output/keyframes"
  overwrite: false
  image_extension: "jpg"
  jpeg_quality: 2                          # ffmpeg -qscale:v (1=best, 31=worst)
  ffmpeg_additional_args: []
  interval_seconds: 10.0
  max_interval_frames: 60
  speech_segment_format: "tsv"
  speech_segment_dir: null
  max_speech_frames: 30
  max_total_frames: 80

# ---------------------------------------------------------------------------
# AI steps. Each section accepts:
#   api_key_env: environment variable holding the key (default OPENAI_API_KEY)
#   base_url:    OpenAI-compatible endpoint. Leave null for OpenAI. Examples:
#                  Ollama:    "http://localhost:11434/v1"   (no key needed)
#                  LM Studio: "http://localhost:1234/v1"    (no key needed)
#                  Gemini:    "https://generativelanguage.googleapis.com/v1beta/openai/"
#                             (with api_key_env: "GOOGLE_API_KEY")
#   You can also set OPENAI_BASE_URL once instead of base_url per section.
#   With Ollama, use models you've pulled, e.g. "llava" or "llama3.2-vision"
#   (vision), "llama3.1" (text), "nomic-embed-text" (embeddings).
# ---------------------------------------------------------------------------

frame_descriptions:
  enabled: false
  model: "gpt-4o-mini"                     # must be vision-capable
  api_key_env: "OPENAI_API_KEY"
  base_url: null
  frames_root: null                        # null = use keyframes.output_dir
  output_dir: "output/frame_descriptions"
  overwrite: false
  max_frames_per_item: 40
  max_transcript_chars: 6000
  temperature: 0.2
  prompt_template: |
    Describe what is depicted in this archival video frame in no more than 20 words.
    {metadata_block}
    Transcript (truncated if long):
    {transcript}
    Timestamp: {timestamp_seconds:.2f} seconds.
  system_prompt: >
    You are an archivist describing individual frames from historical audio-visual materials.
    Focus on neutral, factual, and concise descriptions. Mention any on-screen text verbatim when possible.
  metadata_csv: null                       # optional CSV of item metadata, keyed by file stem
  metadata_id_column: "ID"
  metadata_fields: []
  metadata_missing_fallback: "Archival metadata unavailable."
  transcript_format: "txt"
  transcripts_subdir: null
  transcript_missing_fallback: "Transcript unavailable."

summarization:
  enabled: false
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  base_url: null
  word_limit: 60
  system_prompt: >
    You are an assistant that writes concise, neutral descriptions of archival audiovisual materials.
    Summaries must fit within the requested word limit and avoid sensationalism.
  prompt_template: |
    Provide a {word_limit}-word summary of the archival audiovisual item described below.
    {metadata_block}
    Transcript:
    {transcript}
    Visual descriptions:
    {frame_descriptions}
  transcript_format: "txt"
  transcripts_subdir: null
  max_transcript_chars: 12000
  output_dir: "output/summaries"
  overwrite: false
  metadata_csv: null
  metadata_id_column: "ID"
  metadata_fields: []
  metadata_missing_fallback: "Archival metadata unavailable."
  use_frame_descriptions: true             # used only if frame descriptions exist
  frame_descriptions_dirs: null
  frame_descriptions_limit: 20
  frame_entry_template: "{idx}. ({timestamp:.1f}s) {description}"
  frame_block_template: |
    Visual key points:
    {frames}
  frame_descriptions_missing_fallback: "No frame descriptions available."
  temperature: 0.2

tagging:
  enabled: false
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  base_url: null
  json_mode: true                          # set false if your local model/server rejects JSON mode
  transcript_format: "txt"
  transcripts_subdir: null
  output_dir: "output/tags"
  overwrite: false
  max_transcript_chars: 8000
  prompt_template: |
    Identify key named entities (people, organizations, locations), topical keywords, and summary tags
    that will help archivists describe this archival audiovisual item.
    Provide 3-8 concise entries per category when possible.
    {metadata_block}
    Transcript:
    {transcript}
  system_prompt: >
    You are an archivist creating structured metadata. Return only JSON with fields:
    {"entities": [{"type": "...", "label": "..."}], "topics": ["..."], "keywords": ["..."]}.
  metadata_csv: null
  metadata_id_column: "ID"
  metadata_fields: []
  metadata_missing_fallback: "Archival metadata unavailable."

accessibility:
  enabled: false
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  base_url: null
  transcript_format: "txt"
  frame_descriptions_dirs: null
  output_dir: "output/accessibility_notes"
  overwrite: false
  max_transcript_chars: 8000
  prompt_template: |
    Create concise audio-description style narration cues for the following archival audiovisual item.
    Focus on visual content, on-screen text, and speaker changes.
    Transcript:
    {transcript}
    Visual descriptions:
    {frame_descriptions}
  system_prompt: >
    You produce accessible, neutral narration cues. Avoid interpretation; describe observable content.
  frame_descriptions_missing_fallback: "No visual descriptions available."

collection_reports:                        # needs summaries (and optionally tags)
  enabled: false
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  base_url: null
  summaries_dir: "output/summaries"
  tags_dir: "output/tags"
  output_path: "output/collection_report.md"
  max_items: 200
  prompt_template: |
    Produce a concise research briefing summarizing patterns in the provided summaries and tags.
    Highlight dominant themes, notable entities, and temporal contrasts.
    Data:
    {collection_data}
  system_prompt: >
    You write analytical yet neutral reports for library staff managing large audiovisual collections.
  temperature: 0.2

clustering:                                # needs frame descriptions
  enabled: false
  model: "text-embedding-3-small"          # Ollama: "nomic-embed-text"
  api_key_env: "OPENAI_API_KEY"
  base_url: null
  frame_descriptions_dirs: null
  output_dir: "output/clusters"
  overwrite: false
  n_clusters: 8
  max_items: 2000

# ---------------------------------------------------------------------------
# Output builders (no API calls)
# ---------------------------------------------------------------------------

preview_dashboard:
  enabled: true
  output_path: "output/preview/index.html" # open this in a browser when the run finishes
  max_items: 50
  include_frames: true
  include_summaries: true
  include_tags: true
  include_metadata: true
  static_assets_dir: "output/preview/assets"
  css_file: null

iiif:
  enabled: true
  manifest_output: "output/iiif/manifest.json"
  frames_root: null
  base_media_url: "https://example.org/media"
  base_frame_url: "https://example.org/frames"
  metadata_fields: []

# These three read summaries, so enable them together with `summarization`.
quality_control:
  enabled: false
  output_csv: "output/quality_metrics.csv"
  summary_dir: "output/summaries"
  transcript_dir: null
  transcript_format: "txt"
  frame_descriptions_dirs: null
  min_summary_words: 30
  max_summary_words: 70

catalog_export:
  enabled: false
  output_csv: "output/catalog_export.csv"
  include_transcript_excerpt: true
  transcript_excerpt_chars: 500
  include_summary: true
  include_tags: true

search_index:
  enabled: false
  sqlite_path: "output/search_index.db"
  include_transcripts: true
  include_summaries: true
  include_tags: true

provenance:
  enabled: true
  log_path: "output/provenance_log.jsonl"

# Order of steps for run_pipeline.py. Disabled steps are skipped automatically.
workflow:
  steps:
    - transcribe
    - keyframes
    - describe_frames
    - summarize
    - tags
    - accessibility
    - collection_report
    - preview
    - quality_metrics
    - iiif
    - catalog_export
    - search_index
    - clustering

logging:
  verbose: true                            # print per-file errors as they happen
  progress_interval: 1                     # print progress after every N files
