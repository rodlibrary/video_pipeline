# Installs dependencies, lints, and runs the end-to-end tests on several Python versions.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (Ubuntu 26) no longer provides Python 3.9.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -rA --junitxml=pytest-results.xml
    - name: Report test failures as annotations
      if: failure()
      run: |
        python - <<'EOF'
        import os
        import xml.etree.ElementTree as ET

        if not os.path.exists("pytest-results.xml"):
            raise SystemExit(0)
        for case in ET.parse("pytest-results.xml").iter("testcase"):
            for problem in list(case.findall("failure")) + list(case.findall("error")):
                text = (problem.get("message", "") + "\n" + (problem.text or ""))[-6000:]
                text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                print(f"::error title={case.get('name')}::{text}")
        EOF
